<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vokabel+">
  <meta name="description" content="Vokabel Master+ - Vokabeln lernen mit Karteikarten, Multiple Choice und mehr. Offline-fähige PWA für Schüler ab Klasse 5.">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Vokabel Master+</title>

  <!-- Manifest -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">

  <!-- Styles -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Prevent FOUC -->
  <script>
    (function() {
      const theme = localStorage.getItem('vokabel-theme') || 'system';
      if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header" role="banner">
      <h1>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Vokabel Master+
      </h1>
    </header>

    <!-- Main Content -->
    <main class="app-main" role="main">
      <!-- Learn View -->
      <div id="view-learn" class="view active" role="region" aria-label="Lernen">
        <!-- Content wird dynamisch geladen -->
        <div class="empty-state">
          <div style="width: 40px; height: 40px; border: 3px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
          <p class="mt-md">Laden...</p>
        </div>
      </div>

      <!-- Words View -->
      <div id="view-words" class="view" role="region" aria-label="Vokabeln">
        <!-- Content wird dynamisch geladen -->
      </div>

      <!-- Stats View -->
      <div id="view-stats" class="view" role="region" aria-label="Statistik">
        <!-- Content wird dynamisch geladen -->
      </div>

      <!-- Settings View -->
      <div id="view-settings" class="view" role="region" aria-label="Einstellungen">
        <!-- Content wird dynamisch geladen -->
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" role="navigation" aria-label="Hauptnavigation">
      <button class="nav-item active" data-view="learn" aria-label="Lernen" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span>Lernen</span>
      </button>
      <button class="nav-item" data-view="words" aria-label="Vokabeln">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        <span>Wörter</span>
      </button>
      <button class="nav-item" data-view="stats" aria-label="Statistik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 20V10"/>
          <path d="M12 20V4"/>
          <path d="M6 20v-6"/>
        </svg>
        <span>Statistik</span>
      </button>
      <button class="nav-item" data-view="settings" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Einstellungen</span>
      </button>
    </nav>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <!-- Modal content wird dynamisch geladen -->
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" role="alert" aria-live="polite"></div>

  <!-- Loading Animation Keyframe -->
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- App Script -->
  <script src="./app.js"></script>
</body>
</html>
