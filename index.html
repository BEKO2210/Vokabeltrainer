<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Vokabel Master+ – Englisch-Vokabeln lernen mit Karteikarten, Auswahl, Schreiben und Diktat. Offline, ohne Konto.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vokabel+">

  <title>Vokabel Master+</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=2.0.0">

  <script>
    // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
    (function () {
      var theme = 'system';
      try { theme = localStorage.getItem('vokabel-theme') || 'system'; } catch (e) {}
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d0f16' : '#f6f7fb');
    })();
  </script>
</head>
<body class="is-loading">
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <div class="app">
    <main id="main" class="main" tabindex="-1">
      <div class="boot" aria-live="polite">
        <div class="boot-logo" aria-hidden="true">V+</div>
        <p>Wird geladen …</p>
      </div>
      <section id="view-home" class="view" data-tab="home" aria-label="Start" hidden></section>
      <section id="view-words" class="view" data-tab="words" aria-label="Wörter" hidden></section>
      <section id="view-stats" class="view" data-tab="stats" aria-label="Statistik" hidden></section>
      <section id="view-settings" class="view" data-tab="settings" aria-label="Einstellungen" hidden></section>
      <section id="view-session" class="view view-session" aria-label="Übung" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <button type="button" class="tab is-active" data-action="tab" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M10 21v-5a2 2 0 0 1 4 0v5"/></svg>

        <span>Statistik</span>
      </button>
      <button type="button" class="tab" data-action="tab" data-tab="settings">

        <span>Mehr</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript>

      <h1>JavaScript benötigt</h1>
      <p>Bitte aktiviere JavaScript, um Vokabel Master+ zu nutzen.</p>
    </div>
  </noscript>

  <script src="./vocabulary.js?v=2.0.0"></script>
  <script src="./app.js?v=2.0.0"></script>
</body>
</html>
